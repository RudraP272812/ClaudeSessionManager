ShortDescription: View, manage, and clean up Claude Code CLI session history on Windows.
Description: >-
  ClaudeSessionManager is a Windows desktop app for browsing, searching, and
  deleting Claude Code CLI session history. It scans local session transcripts
  and the VS Code Claude Code extension cache to show session titles, projects,
  and archived state, so you can remove old or archived sessions in bulk.
